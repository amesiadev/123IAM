<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7"><title>123IAM - Aventura Matemática</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#30354a;background:linear-gradient(160deg,#6dd5fa,#8e7dff)}button,input,select{font:inherit}.app{width:min(820px,100%)}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:30px;padding:clamp(20px,5vw,36px);text-align:center;box-shadow:0 20px 60px #30354a33}.mascot{font-size:80px;animation:float 2s ease-in-out infinite}h1,h2{color:#5746d9}.intro{max-width:650px;margin:10px auto 22px;line-height:1.55;color:#4d5368}label{display:block;text-align:left;font-weight:850;margin:15px 0 7px}input,select{width:100%;min-height:58px;border:3px solid #dedcff;border-radius:18px;padding:12px 16px;background:#fff}.primary,.secondary,.icon,.answer{border:0;cursor:pointer}.primary{width:100%;min-height:64px;margin-top:20px;border-radius:20px;background:linear-gradient(135deg,#ffb703,#ff7b00);color:#fff;font-weight:950;font-size:1.2rem;box-shadow:0 7px 0 #d95f00}.primary:disabled{opacity:.55;box-shadow:none}.secondary{min-height:48px;padding:10px 16px;border-radius:15px;background:#eeeaff;color:#4b39bf;font-weight:850}.world-badge,.timer{display:inline-block;padding:8px 14px;border-radius:999px;background:#eeeaff;color:#4b39bf;font-weight:900}.world-art{min-height:160px;display:grid;place-items:center;margin:16px 0;border-radius:24px;font-size:76px}.topbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:16px}.icon{width:48px;height:48px;border-radius:15px;background:#eeeaff;font-size:1.25rem}.track{height:13px;background:#eceefa;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffca28,#ff8a00)}.progress-row{display:flex;justify-content:space-between;color:#667085;font-size:.85rem;font-weight:800;margin-bottom:5px}.stars{font-weight:900;color:#8b6700}.challenge{padding:clamp(15px,4vw,26px);border:3px solid #eceeff;border-radius:24px;background:#fbfcff}.kicker{font-weight:900;color:#4b39bf}.question{min-height:58px;display:grid;place-items:center;font-size:clamp(1.45rem,6vw,2.2rem);font-weight:950}.visual{min-height:125px;margin:10px 0 15px;padding:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;border-radius:20px;background:#f2fbff;border:3px solid #d8f2ff}.visual.space{background:radial-gradient(circle,#5f56b5,#23185e 72%);color:#fff;border-color:#9187e7}.visual.city{background:linear-gradient(#bcecff 58%,#f1d08b 58%);border-color:#a8d9e8}.obj{font-size:40px}.removed{opacity:.2;filter:grayscale(1)}.symbol{font-size:2rem;font-weight:950}.group{display:inline-flex;gap:2px;flex-wrap:wrap;padding:8px;border:3px solid #bde8cb;border-radius:16px;background:#fff}.planet-grid{display:grid;gap:7px;justify-content:center}.planet{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#ffd166}.city-row{display:flex;gap:9px;align-items:flex-end;justify-content:center;flex-wrap:wrap}.building{min-width:70px;padding:10px;border:3px solid #6c5ce7;border-radius:13px 13px 4px 4px;background:#fff;font-weight:950}.building small{display:block;color:#667085}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:15px}.answers.two{grid-template-columns:repeat(2,1fr)}.answer{min-height:74px;border-radius:20px;background:#fff5c8;color:#5b4600;font-size:1.9rem;font-weight:950;box-shadow:0 6px 0 #e4b112}.answer.good{background:#dcf9e7;color:#176c39}.feedback{min-height:45px;display:grid;place-items:center;margin-top:10px;font-weight:850}.hint{display:none;margin-top:9px;padding:13px;border-radius:16px;background:#fff3c4;color:#6d5200;font-weight:800;line-height:1.4}.hint.show{display:block}.hintline{margin-top:8px;font-size:1.05rem}.timer{display:none;margin-bottom:8px}.timer.show{display:inline-block}.timer.low{background:#fff1c4;color:#8b5d00}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{padding:16px;border-radius:18px;background:#f5f3ff}.stat strong{display:block;font-size:2rem;color:#4b39bf}.note{color:#667085;font-size:.95rem}@media(max-width:560px){.answers,.answers.two{grid-template-columns:1fr}.topbar{grid-template-columns:48px 1fr auto}.world-art{min-height:130px}}@keyframes float{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="app">
<section id="setup" class="screen active"><div class="card"><div class="mascot">🦊</div><h1>¡Hola! Soy IAM</h1><p class="intro">¡Bienvenido a <b>123IAM</b>! 🌟 Vamos a viajar por mundos increíbles mientras jugamos y aprendemos matemáticas.</p><form id="playerForm"><label>¿Cómo te llamas?</label><input id="nombre" maxlength="20" autocomplete="off" required placeholder="Escribe tu nombre"><label>¿Cuántos años tienes?</label><select id="edad" required><option value="">Elige tu edad</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><button class="primary">🚀 ¡Comenzar mi aventura!</button></form><button id="listenWelcome" class="secondary" style="margin-top:15px">🔊 Escuchar a IAM</button></div></section>
<section id="world" class="screen"><div class="card"><div id="worldBadge" class="world-badge"></div><h2 id="worldTitle"></h2><p id="worldDescription" class="intro"></p><div id="worldArt" class="world-art"></div><button id="enterWorld" class="primary"></button><p id="worldNote" class="note"></p><button id="changePlayer" class="secondary">👤 Cambiar jugador</button></div></section>
<section id="game" class="screen"><div class="card"><div class="topbar"><button id="home" class="icon">⌂</button><div><div class="progress-row"><span id="roundText"></span><span id="miniName"></span></div><div class="track"><div id="bar" class="bar"></div></div></div><div id="starCount" class="stars">⭐ 0</div></div><div class="challenge"><div id="gameKicker" class="kicker"></div><div id="timer" class="timer"></div><div id="question" class="question"></div><div id="visual" class="visual"></div><button id="repeat" class="secondary">🔊 Escuchar pregunta</button><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="hint" class="hint"></div></div></div></section>
<section id="complete" class="screen"><div class="card"><div id="completeMascot" class="mascot">🏆</div><h1>¡Misión completada!</h1><p id="completeMessage" class="intro"></p><div class="stats"><div class="stat"><strong id="correctStat">0</strong>Retos logrados</div><div class="stat"><strong id="hintStat">0</strong>Pistas usadas</div></div><button id="again" class="primary">🎮 Jugar otra misión</button><button id="backWorld" class="secondary" style="margin-top:14px">🗺️ Volver al mundo</button></div></section>
</main><script>
(()=>{
const PK="123iam_player",GK="123iam_progress",$=id=>document.getElementById(id),S=["setup","world","game","complete"];
const W={1:{name:"🌈 El Valle de los Números",desc:"Contaremos objetos y resolveremos sumas y restas hasta 10.",art:"🦊🔢",bg:"linear-gradient(#8be7ff 58%,#9ee57a 58%)",rounds:8,k:"🌈 El Valle de los Números"},2:{name:"🌴 La Selva Matemática",desc:"Resolveremos sumas, restas y tablas 1, 2, 3 y 5.",art:"🐒🌴",bg:"linear-gradient(#77d6ff 52%,#62c86e 52%)",rounds:10,k:"🌴 La Selva Matemática"},3:{name:"🚀 La Galaxia de las Tablas",desc:"Practicaremos tablas 4, 6, 7 y 8 con velocidad, precisión y lógica espacial.",art:"🚀🪐",bg:"radial-gradient(circle,#6358c7,#211657 70%)",rounds:10,k:"🚀 La Galaxia de las Tablas"},4:{name:"🏙️ La Ciudad de los Maestros",desc:"Dominaremos las tablas 9 y 10, repasaremos del 1 al 10 y resolveremos problemas aplicados.",art:"🏙️🏆",bg:"linear-gradient(#79d7ff 55%,#e7bd76 55%)",rounds:12,k:"🏙️ La Ciudad de los Maestros"}};
const O=[["🍎","manzanas"],["⭐","estrellas"],["🌼","flores"],["🍓","fresas"],["🥭","mangos"],["🐒","monitos"]],GOOD=["¡Fantástico! 🌟","¡Lo hiciste genial! 🎉","¡Excelente trabajo! ⭐"],GENTLE=["¡Casi! Inténtalo otra vez 💪","¡Buen intento! Vamos una vez más 🌟","¡Vas muy bien! Mira con calma 😊"];
let p=load(PK,null),c=null,r=0,stars=0,hints=0,miss=0,lock=false,timer=null,left=0,speedHits=0;
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function show(x){S.forEach(n=>$(n).classList.toggle("active",n===x));scrollTo(0,0)}function world(age){return age<=5?1:age<=7?2:age===8?3:4}
function say(t){if(!("speechSynthesis"in window)||!t)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="es-CO";u.rate=p?.mundo===1?.88:.93;u.pitch=1.1;speechSynthesis.speak(u)}
function config(){if(!p)return;let w=W[p.mundo];$("worldBadge").textContent=`Mundo ${p.mundo}`;$("worldTitle").textContent=`¡${p.nombre}, tu aventura comienza en ${w.name}!`;$("worldDescription").textContent=w.desc;$("worldArt").textContent=w.art;$("worldArt").style.background=w.bg;$("miniName").textContent=p.nombre;let labels={1:["🌟 ¡Entrar al Valle!","Conteo, suma y resta hasta 10."],2:["🌴 ¡Explorar la Selva!","Suma, resta y tablas 1, 2, 3 y 5."],3:["🚀 ¡Despegar a la Galaxia!","Tablas 4, 6, 7 y 8 con velocidad y lógica."],4:["🏙️ ¡Entrar a la Ciudad!","Maestría: tablas 9 y 10, repaso 1–10 y problemas aplicados."]}[p.mundo];$("enterWorld").textContent=labels[0];$("enterWorld").disabled=false;$("worldNote").textContent=labels[1]}
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],shuffle=a=>[...a].sort(()=>Math.random()-.5),objs=(n,e,off=false)=>Array.from({length:n},()=>`<span class="obj${off?" removed":""}">${e}</span>`).join("");
function q1(){let t=pick(["count","add","sub"]),o=pick(O.slice(0,4));if(t==="count"){let a=ri(1,10);return{w:1,t,a,b:0,ans:a,max:10,o,q:`¿Cuántas ${o[1]} ves?`,s:`¿Cuántas ${o[1]} ves? Cuenta con calma.`}}if(t==="add"){let a=ri(1,6),b=ri(1,10-a);return{w:1,t,a,b,ans:a+b,max:10,o,q:`${a} + ${b} = ¿cuánto?`,s:`Tenemos ${a} ${o[1]} y llegan ${b} más. ¿Cuántas hay?`}}let a=ri(2,10),b=ri(1,a);return{w:1,t,a,b,ans:a-b,max:10,o,q:`${a} − ${b} = ¿cuánto?`,s:`Había ${a} ${o[1]} y se fueron ${b}. ¿Cuántas quedan?`}}
function q2(){let t=pick(["add2","sub2","mult","mult"]);if(t==="add2"){let a=ri(10,p.edad===6?49:79),b=ri(10,Math.min(49,99-a));return{w:2,t,a,b,ans:a+b,max:99,q:`${a} + ${b} = ¿cuánto?`,s:`¿Cuánto es ${a} más ${b}?`}}if(t==="sub2"){let a=ri(20,p.edad===6?69:99),b=ri(10,a-1);return{w:2,t,a,b,ans:a-b,max:99,q:`${a} − ${b} = ¿cuánto?`,s:`¿Cuánto es ${a} menos ${b}?`}}let a=pick([1,2,3,5]),b=p.edad===6?ri(1,6):ri(2,10),o=pick(O.slice(4));return{w:2,t:"mult",a,b,ans:a*b,max:50,o,q:`${b} grupos de ${a} = ¿cuántos?`,s:`Hay ${b} grupos con ${a} ${o[1]} en cada grupo. ¿Cuántos hay?`}}
function q3(){let a=pick([4,6,7,8]),b=ri(2,10),t=pick(["speed","precision","spatial"]);if(t==="speed")return{w:3,t,a,b,ans:a*b,max:80,q:`⚡ ${a} × ${b} = ¿cuánto?`,s:`Pulso orbital. ¿Cuánto es ${a} por ${b}?`};if(t==="precision")return{w:3,t,a,b,ans:a*b,max:80,q:`🎯 ${a} × ${b} = ¿cuánto?`,s:`Radar de precisión. Encuentra ${a} por ${b}.`};if(Math.random()<.45)return{w:3,t:"spatial",mode:"missing",a,b,total:a*b,ans:b,max:10,q:`🪐 ${a} filas forman ${a*b} planetas. ¿Cuántas columnas?`,s:`Hay ${a} filas y ${a*b} planetas. ¿Cuántas columnas?`};return{w:3,t:"spatial",a,b,ans:a*b,max:80,q:`🪐 ${a} filas de ${b} planetas. ¿Cuántos hay?`,s:`Observa ${a} filas de ${b}. ¿Cuántos planetas hay?`}}
function q4(){let t=pick(["master","master","review","missing","problem"]);if(t==="master"){let a=pick([9,10]),b=ri(2,10);return{w:4,t,a,b,ans:a*b,max:100,q:`🏆 ${a} × ${b} = ¿cuánto?`,s:`Desafío de maestro. ¿Cuánto es ${a} por ${b}?`}}if(t==="review"){let a=ri(1,10),b=ri(2,10);return{w:4,t,a,b,ans:a*b,max:100,q:`🧠 Repaso: ${a} × ${b} = ¿cuánto?`,s:`Repaso total. ¿Cuánto es ${a} por ${b}?`}}if(t==="missing"){let a=ri(2,10),b=ri(2,10);return{w:4,t,a,b,total:a*b,ans:b,max:10,q:`🔎 ${a} × ? = ${a*b}. ¿Qué número falta?`,s:`Encuentra el factor perdido. ${a} por qué número es ${a*b}?`}}let x=pick([["🚌","autobuses","niños"],["🏢","edificios","ventanas"],["🌳","parques","árboles"],["🚲","estaciones","bicicletas"]]),a=ri(2,8),b=ri(3,10);return{w:4,t:"problem",a,b,ans:a*b,max:80,x,q:`${x[0]} Hay ${a} ${x[1]} con ${b} ${x[2]} en cada uno. ¿Cuántos ${x[2]} hay?`,s:`Problema de la ciudad. Hay ${a} ${x[1]} con ${b} ${x[2]} en cada uno. ¿Cuántos hay en total?`}}
function question(){return p.mundo===4?q4():p.mundo===3?q3():p.mundo===2?q2():q1()}
function visual(){let v=$("visual");v.className="visual"+(c.w===3?" space":c.w===4?" city":"");if(c.w===1){v.innerHTML=c.t==="count"?objs(c.a,c.o[0]):c.t==="add"?`${objs(c.a,c.o[0])}<span class="symbol">+</span>${objs(c.b,c.o[0])}`:`${objs(c.a-c.b,c.o[0])}${objs(c.b,c.o[0],true)}`;return}if(c.w===2){if(c.t==="mult"){v.innerHTML=Array.from({length:c.b},()=>`<span class="group">${objs(c.a,c.o[0])}</span>`).join("");return}v.innerHTML=`<div class="city-row"><div class="building">${c.a}<small>primer número</small></div><span class="symbol">${c.t==="add2"?"+":"−"}</span><div class="building">${c.b}<small>segundo número</small></div></div>`;return}if(c.w===3){if(c.t==="spatial"){let cells=Array.from({length:c.a*c.b},()=>'<span class="planet">•</span>').join("");v.innerHTML=`<div><div class="planet-grid" style="grid-template-columns:repeat(${c.b},30px)">${cells}</div><b>${c.a} filas × ${c.b} columnas</b></div>`}else v.innerHTML=`<div style="font-size:70px">🚀</div><b>${c.a} × ${c.b} = ?</b>`;return}if(c.t==="problem"){v.innerHTML=`<div class="building">${c.x[0]} ${c.a} ${c.x[1]}<small>${c.b} ${c.x[2]} cada uno</small></div>`}else if(c.t==="missing"){v.innerHTML=`<div class="city-row"><div class="building">${c.a}</div><b>×</b><div class="building">?</div><b>=</b><div class="building">${c.total}</div></div>`}else v.innerHTML=`<div class="city-row"><div class="building">${c.a}</div><b>×</b><div class="building">${c.b}</div><b>=</b><div class="building">?</div></div>`}
function opts(n=3){let max=c.max||100,d=max===10?3:max<=50?8:15,s=new Set([c.ans]);while(s.size<n){let x=Math.max(0,Math.min(max,c.ans+ri(-d,d)));if(x!==c.ans)s.add(x)}return shuffle([...s])}
function answers(a=opts()){let b=$("answers");b.innerHTML="";b.classList.toggle("two",a.length===2);a.forEach(x=>{let q=document.createElement("button");q.className="answer";q.textContent=x;q.onclick=()=>choose(x,q);b.appendChild(q)})}
function update(){let n=W[p.mundo].rounds;$("roundText").textContent=`Reto ${Math.min(r+1,n)} de ${n}`;$("bar").style.width=`${r/n*100}%`;$("starCount").textContent=`⭐ ${stars}`}
function clearTimer(){if(timer)clearInterval(timer);timer=null;$("timer").className="timer";$("timer").textContent=""}
function startTimer(){left=15;$("timer").className="timer show";$("timer").textContent=`⏱️ ${left}`;timer=setInterval(()=>{left--;$("timer").textContent=`⏱️ ${Math.max(0,left)}`;$("timer").classList.toggle("low",left<=5);if(left<=0){clearTimer();$("feedback").textContent="¡Recarga de energía! Te doy una pista 🚀";say("No pasa nada. Te doy una pista para seguir.");hint(true)}},1000)}
function next(){if(r>=W[p.mundo].rounds)return finish();clearTimer();lock=false;miss=0;c=question();$("gameKicker").textContent=W[p.mundo].k;$("question").textContent=c.q;$("feedback").textContent="";$("hint").className="hint";$("hint").innerHTML="";visual();answers();update();say(c.s);if(c.w===3&&c.t==="speed")setTimeout(()=>{if(!lock)startTimer()},1600)}
function choose(x,b){if(lock)return;if(x===c.ans){if(c.w===3&&c.t==="speed"&&timer&&left>0)speedHits++;clearTimer();lock=true;b.classList.add("good");stars++;let m=pick(GOOD);$("feedback").textContent=m;say(`${m} La respuesta es ${c.ans}.`);r++;update();setTimeout(next,900)}else{miss++;let m=pick(GENTLE);$("feedback").textContent=m;say(m);if(miss>=2)hint()}}
function hint(auto=false){if($("hint").classList.contains("show"))return;clearTimer();hints++;let t="";if(c.w===1)t=c.ans===0?"No queda ninguno. La respuesta es cero.":`Cuenta despacio hasta ${c.ans}.`;else if(c.w===2&&c.t==="mult")t=`Multiplicar es sumar ${c.a}, ${c.b} veces. El resultado es ${c.ans}.`;else if(c.w===2)t=`Separa decenas y unidades. La respuesta es ${c.ans}.`;else if(c.w===3&&c.t==="spatial")t=`Multiplica filas por columnas: ${c.a} por ${c.b}.`;else if(c.w===3)t=`Puedes sumar ${c.a}, ${c.b} veces. Obtienes ${c.ans}.`;else if(c.t==="missing")t=`Divide ${c.total} entre ${c.a}. El factor faltante es ${c.ans}.`;else if(c.t==="problem")t=`Son ${c.a} grupos de ${c.b}. Multiplica para obtener ${c.ans}.`;else if(c.a===9)t=`Truco del 9: 10 por ${c.b} menos ${c.b} es ${c.ans}.`;else if(c.a===10)t=`En la tabla del 10 agrega un cero: ${c.ans}.`;else t=`Forma ${c.b} grupos de ${c.a}. El resultado es ${c.ans}.`;$("hint").innerHTML=`💡 ${t}<div class="hintline">Ahora tienes solo dos opciones.</div>`;$("hint").classList.add("show");let other=opts().find(x=>x!==c.ans);answers(shuffle([c.ans,other]));say(t+" Ahora elige entre dos opciones.");if(auto)miss=2}
function start(){clearTimer();r=stars=hints=miss=speedHits=0;lock=false;show("game");say(`¡Vamos, ${p.nombre}! Comienza tu misión en ${W[p.mundo].name}.`);setTimeout(next,500)}
function finish(){clearTimer();let g=load(GK,{}),k=`world${p.mundo}`;g[k]=g[k]||{missionsCompleted:0,bestStars:0,hintsUsed:0};g[k].missionsCompleted++;g[k].bestStars=Math.max(g[k].bestStars,stars);g[k].hintsUsed+=hints;g[k].lastPlayedAt=new Date().toISOString();if(p.mundo===3)g[k].speedHits=(g[k].speedHits||0)+speedHits;if(p.mundo===4&&stars===W[4].rounds)g[k].perfectMissions=(g[k].perfectMissions||0)+1;save(GK,g);$("correctStat").textContent=stars;$("hintStat").textContent=hints;$("completeMascot").textContent={1:"🦊🏆",2:"🐒🏆",3:"🚀🏆",4:"🏙️🏆"}[p.mundo];let medal=p.mundo===4?(stars===12?" ¡Medalla de Maestría Perfecta! 🥇":stars>=9?" ¡Medalla de Maestro Matemático! 🏅":" ¡Tu maestría sigue creciendo! 🌟"):"";$("completeMessage").textContent=`¡${p.nombre}, completaste ${W[p.mundo].name}! Lograste ${stars} de ${W[p.mundo].rounds} retos.${medal}`;show("complete");say($("completeMessage").textContent)}
$("playerForm").onsubmit=e=>{e.preventDefault();let n=$("nombre").value.trim(),a=+$("edad").value;if(!n||!a)return;p={nombre:n,edad:a,mundo:world(a),creadoEn:new Date().toISOString()};save(PK,p);config();show("world");say(`¡Excelente, ${n}! Tu aventura comienza en ${W[p.mundo].name}.`)};
$("listenWelcome").onclick=()=>say("¡Hola! Soy IAM. Dime cómo te llamas y cuántos años tienes.");$("enterWorld").onclick=start;$("repeat").onclick=()=>say(c?.s);$("home").onclick=()=>{clearTimer();config();show("world")};$("again").onclick=start;$("backWorld").onclick=()=>{config();show("world")};$("changePlayer").onclick=()=>{clearTimer();p=null;localStorage.removeItem(PK);$("nombre").value="";$("edad").value="";show("setup")};
if(p?.nombre){$("nombre").value=p.nombre;$("edad").value=p.edad;config();show("world")}
})();
</script></body></html>
