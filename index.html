<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>123IAM - Aventura Matemática</title>
<style>
:root{--p:#6c5ce7;--pd:#4b39bf;--ink:#30354a;--muted:#667085;--yellow:#ffca28;--orange:#ff8a00;--green:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,#6dd5fa,#8e7dff);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select{font:inherit}button{touch-action:manipulation}.app{width:min(820px,100%)}.screen{display:none}.screen.active{display:block;animation:fade .35s ease}
.card{background:rgba(255,255,255,.98);border-radius:30px;padding:clamp(20px,5vw,36px);text-align:center;box-shadow:0 20px 60px rgba(48,53,74,.2)}
.mascot{font-size:clamp(70px,15vw,96px);line-height:1;animation:float 2s ease-in-out infinite}
h1{font-size:clamp(2rem,8vw,3.5rem);color:#5746d9;margin:12px 0}h2{color:#5746d9}
.intro{max-width:650px;margin:10px auto 22px;color:#4d5368;font-size:clamp(1rem,3.6vw,1.18rem);line-height:1.55}
label{display:block;text-align:left;margin:17px 0 7px;font-size:1.08rem;font-weight:850}
input,select{width:100%;min-height:60px;border:3px solid #dedcff;border-radius:18px;padding:12px 16px;font-size:1.15rem;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(108,92,231,.12)}
.primary,.secondary,.icon,.answer{border:0;cursor:pointer}.primary{width:100%;min-height:66px;margin-top:23px;border-radius:20px;background:linear-gradient(135deg,#ffb703,#ff7b00);color:#fff;font-size:1.25rem;font-weight:950;box-shadow:0 8px 0 #d95f00}
.primary:active{transform:translateY(5px);box-shadow:0 3px 0 #d95f00}.primary:disabled{filter:grayscale(.75);opacity:.65;cursor:not-allowed;box-shadow:none}
.secondary{min-height:50px;padding:10px 18px;border-radius:16px;background:#eeeaff;color:var(--pd);font-weight:850}
.world-badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#eeeaff;color:var(--pd);font-weight:900;margin-bottom:14px}
.world-art{min-height:180px;display:grid;place-items:center;margin:18px 0;border-radius:25px;font-size:clamp(60px,15vw,90px);overflow:hidden}
.topbar{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;margin-bottom:18px}.icon{width:50px;height:50px;border-radius:15px;background:#eeeaff;color:var(--pd);font-size:1.3rem;font-weight:900}
.progress-wrap{text-align:left;min-width:0}.progress-row{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.86rem;font-weight:800;margin-bottom:6px}
.track{height:14px;background:#eceefa;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:inherit;transition:width .3s ease}
.stars{font-weight:900;color:#8b6700;white-space:nowrap}.challenge{padding:clamp(16px,4vw,28px);border-radius:25px;background:#fbfcff;border:3px solid #eceeff}
.kicker{font-weight:900;color:var(--pd);margin-bottom:8px}.question{font-size:clamp(1.5rem,6vw,2.25rem);font-weight:950;min-height:58px;display:grid;place-items:center}
.visual{min-height:125px;margin:12px 0 16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;border-radius:22px;background:#f2fbff;border:3px solid #d8f2ff}
.obj{font-size:clamp(32px,7vw,48px);display:inline-block;animation:pop .25s ease both}.obj.removed{opacity:.22;filter:grayscale(1)}.symbol{font-size:2.5rem;font-weight:950;color:var(--pd)}
.group-wrap{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.math-group{min-width:82px;min-height:76px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;border-radius:18px;background:#fff;border:3px solid #bde8cb;box-shadow:0 5px 0 #8fd5a8}
.equation-strip{width:100%;font-size:clamp(1.1rem,4vw,1.45rem);font-weight:900;color:#356443;margin-top:6px}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:17px}.answers.two{grid-template-columns:repeat(2,1fr)}
.answer{min-height:78px;border-radius:21px;background:#fff5c8;color:#5b4600;font-size:clamp(1.55rem,6vw,2.25rem);font-weight:950;box-shadow:0 7px 0 #e4b112}
.answer:active{transform:translateY(4px);box-shadow:0 3px 0 #e4b112}.answer.good{background:#dcf9e7;color:#176c39;box-shadow:0 7px 0 #7ad69b}
.feedback{min-height:48px;margin-top:13px;display:grid;place-items:center;font-size:1.08rem;font-weight:850}
.hint{display:none;margin-top:10px;padding:14px;border-radius:17px;background:#fff3c4;color:#6d5200;font-weight:800;line-height:1.45}.hint.show{display:block;animation:pop .25s ease}
.hint-count{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}.hint-count span{min-width:37px;height:37px;padding:0 7px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#5f4800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.stat{padding:18px;border-radius:18px;background:#f5f3ff}.stat strong{display:block;font-size:2rem;color:var(--pd)}
.note{font-size:.95rem;color:var(--muted);margin-top:12px}
@media(max-width:560px){.answers,.answers.two{grid-template-columns:1fr}.world-art{min-height:140px}.visual{min-height:105px}.topbar{grid-template-columns:46px 1fr auto}.icon{width:46px;height:46px}.math-group{min-width:70px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main class="app">
<section id="setup" class="screen active"><div class="card"><div class="mascot">🦊</div><h1>¡Hola! Soy IAM</h1><p class="intro">¡Bienvenido a <strong>123IAM</strong>! 🌟 Vamos a viajar por mundos increíbles mientras jugamos, contamos y aprendemos matemáticas.</p><form id="playerForm"><label for="nombre">¿Cómo te llamas?</label><input id="nombre" maxlength="20" autocomplete="off" placeholder="Escribe tu nombre" required><label for="edad">¿Cuántos años tienes?</label><select id="edad" required><option value="">Elige tu edad</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><button class="primary" type="submit">🚀 ¡Comenzar mi aventura!</button></form><button id="listenWelcome" class="secondary" type="button" style="margin-top:16px">🔊 Escuchar a IAM</button></div></section>
<section id="world" class="screen"><div class="card"><div id="worldBadge" class="world-badge"></div><h2 id="worldTitle"></h2><p id="worldDescription" class="intro"></p><div id="worldArt" class="world-art"></div><button id="enterWorld" class="primary" type="button"></button><p id="worldNote" class="note"></p><button id="changePlayer" class="secondary" type="button" style="margin-top:15px">👤 Cambiar jugador</button></div></section>
<section id="game" class="screen"><div class="card"><div class="topbar"><button id="home" class="icon" type="button" aria-label="Volver al mundo">⌂</button><div class="progress-wrap"><div class="progress-row"><span id="roundText">Reto 1</span><span id="miniName"></span></div><div class="track"><div id="bar" class="bar"></div></div></div><div id="starCount" class="stars">⭐ 0</div></div><div class="challenge"><div id="gameKicker" class="kicker"></div><div id="question" class="question"></div><div id="visual" class="visual"></div><button id="repeat" class="secondary" type="button">🔊 Escuchar pregunta</button><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="hint" class="hint" aria-live="polite"></div></div></div></section>
<section id="complete" class="screen"><div class="card"><div id="completeMascot" class="mascot">🦊🏆</div><h1>¡Misión completada!</h1><p id="completeMessage" class="intro"></p><div class="stats"><div class="stat"><strong id="correctStat">0</strong><span>Retos logrados</span></div><div class="stat"><strong id="hintStat">0</strong><span>Pistas usadas</span></div></div><button id="again" class="primary" type="button">🎮 Jugar otra misión</button><button id="backWorld" class="secondary" type="button" style="margin-top:15px">🗺️ Volver al mundo</button></div></section>
</main>
<script>
(()=>{
const PLAYER_KEY="123iam_player",PROGRESS_KEY="123iam_progress";
const $=id=>document.getElementById(id);
const screens={setup:$("setup"),world:$("world"),game:$("game"),complete:$("complete")};
const mundos={
1:{name:"🌈 El Valle de los Números",desc:"Aquí conoceremos números, contaremos objetos y resolveremos sumas y restas muy divertidas.",art:"🦊🔢",bg:"linear-gradient(180deg,#8be7ff 0 58%,#9ee57a 58% 100%)",rounds:8,kicker:"🌈 El Valle de los Números"},
2:{name:"🌴 La Selva Matemática",desc:"Exploraremos la selva resolviendo sumas y restas de dos dígitos y descubriendo las tablas del 1, 2, 3 y 5.",art:"🐒🌴",bg:"linear-gradient(180deg,#77d6ff 0 52%,#62c86e 52% 100%)",rounds:10,kicker:"🌴 La Selva Matemática"},
3:{name:"🚀 La Galaxia de las Tablas",desc:"Viajaremos por planetas matemáticos mientras practicamos las tablas del 4, 6, 7 y 8.",art:"🚀🪐",bg:"linear-gradient(180deg,#2f2670 0 65%,#594ac8 100%)",rounds:10,kicker:"🚀 La Galaxia de las Tablas"},
4:{name:"🏙️ La Ciudad de los Maestros",desc:"Resolveremos grandes desafíos con las tablas del 9 y 10 y repasaremos todas las tablas.",art:"🏙️🏆",bg:"linear-gradient(180deg,#79d7ff 0 55%,#e7bd76 55% 100%)",rounds:10,kicker:"🏙️ La Ciudad de los Maestros"}
};
const objects=[{e:"🍎",n:"manzanas"},{e:"⭐",n:"estrellas"},{e:"🐞",n:"mariquitas"},{e:"🌼",n:"flores"},{e:"🦋",n:"mariposas"},{e:"🍓",n:"fresas"},{e:"🥭",n:"mangos"},{e:"🐒",n:"monitos"}];
const good=["¡Fantástico! 🌟","¡Lo hiciste genial! 🎉","¡Muy bien, explorador! 🚀","¡Excelente trabajo! ⭐"];
const gentle=["¡Casi! Inténtalo otra vez 💪","¡Buen intento! Vamos una vez más 🌟","¡Vas muy bien! Mira con calma 😊"];
let player=load(PLAYER_KEY,null),current=null,round=0,stars=0,hints=0,misses=0,locked=false;
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function show(name){Object.entries(screens).forEach(([k,v])=>v.classList.toggle("active",k===name));window.scrollTo({top:0,behavior:"smooth"})}
function mundo(edad){if(edad<=5)return 1;if(edad<=7)return 2;if(edad===8)return 3;return 4}
function totalRounds(){return mundos[player?.mundo]?.rounds||8}
function speak(text){if(!("speechSynthesis" in window)||!text)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="es-CO";u.rate=player?.mundo===1?.88:.92;u.pitch=1.1;u.volume=1;window.speechSynthesis.speak(u)}
function welcome(){speak("¡Hola! Soy IAM. Bienvenido a 123 IAM. Primero dime cómo te llamas y cuántos años tienes.")}
function configureWorld(){if(!player)return;const w=mundos[player.mundo];$("worldBadge").textContent=`Mundo ${player.mundo}`;$("worldTitle").textContent=`¡${player.nombre}, tu aventura comienza en ${w.name}!`;$("worldDescription").textContent=w.desc;$("worldArt").textContent=w.art;$("worldArt").style.background=w.bg;$("miniName").textContent=player.nombre;if(player.mundo===1){$("enterWorld").textContent="🌟 ¡Entrar al Valle!";$("enterWorld").disabled=false;$("worldNote").textContent="Misión disponible: conteo, suma y resta hasta 10."}else if(player.mundo===2){$("enterWorld").textContent="🌴 ¡Explorar la Selva!";$("enterWorld").disabled=false;$("worldNote").textContent="Misión disponible: suma, resta y multiplicación como suma repetida."}else{$("enterWorld").textContent="🔒 Mundo en preparación";$("enterWorld").disabled=true;$("worldNote").textContent="Este mundo ya está asignado a tu perfil y se habilitará en una próxima etapa."}}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[ri(0,a.length-1)]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function obj(n,e,removed=false){return Array.from({length:n},(_,i)=>`<span class="obj${removed?" removed":""}" style="animation-delay:${i*35}ms">${e}</span>`).join("")}
function challengeWorld1(){const type=pick(["count","add","sub"]),o=pick(objects.slice(0,6));if(type==="count"){const a=ri(1,10);return{world:1,type,a,b:0,answer:a,o,q:`¿Cuántas ${o.n} ves?`,speech:`¿Cuántas ${o.n} ves? Cuenta con calma y toca el número correcto.`}}if(type==="add"){const a=ri(1,6),b=ri(1,10-a);return{world:1,type,a,b,answer:a+b,o,q:`${a} + ${b} = ¿cuánto?`,speech:`Tenemos ${a} ${o.n} y llegan ${b} más. ¿Cuántas hay ahora?`}}const a=ri(2,10),b=ri(1,a);return{world:1,type,a,b,answer:a-b,o,q:`${a} − ${b} = ¿cuánto?`,speech:`Había ${a} ${o.n} y se fueron ${b}. ¿Cuántas quedan?`}}
function challengeWorld2(){const age=player.edad,type=pick(["add2","sub2","mult","mult"]);if(type==="add2"){const max=age===6?49:79,a=ri(10,max),b=ri(10,Math.min(max,99-a));return{world:2,type,a,b,answer:a+b,q:`${a} + ${b} = ¿cuánto?`,speech:`Cruza el río de la suma. ¿Cuánto es ${a} más ${b}?`}}if(type==="sub2"){const max=age===6?69:99,a=ri(20,max),b=ri(10,a-1);return{world:2,type,a,b,answer:a-b,q:`${a} − ${b} = ¿cuánto?`,speech:`Ayuda al explorador. ¿Cuánto es ${a} menos ${b}?`}}const table=pick([1,2,3,5]),factor=age===6?ri(1,6):ri(2,10),o=pick(objects.slice(6));return{world:2,type:"mult",a:table,b:factor,answer:table*factor,o,q:`${factor} grupos de ${table} = ¿cuántos?`,speech:`Tenemos ${factor} grupos con ${table} ${o.n} en cada grupo. ¿Cuántos ${o.n} hay en total?`}}
function challenge(){return player.mundo===2?challengeWorld2():challengeWorld1()}
function renderVisual(c){const box=$("visual");if(c.world===1){if(c.type==="count"){box.innerHTML=obj(c.a,c.o.e);return}if(c.type==="add"){box.innerHTML=`<span>${obj(c.a,c.o.e)}</span><span class="symbol">+</span><span>${obj(c.b,c.o.e)}</span>`;return}box.innerHTML=`<span>${obj(c.a-c.b,c.o.e)}${obj(c.b,c.o.e,true)}</span>`;return}if(c.type==="add2"){const aT=Math.floor(c.a/10),aU=c.a%10,bT=Math.floor(c.b/10),bU=c.b%10;box.innerHTML=`<div><div class="equation-strip">Decenas y unidades</div><div class="group-wrap"><div class="math-group">🔟 × ${aT}<br>• × ${aU}</div><span class="symbol">+</span><div class="math-group">🔟 × ${bT}<br>• × ${bU}</div></div></div>`;return}if(c.type==="sub2"){box.innerHTML=`<div><div class="equation-strip">Piensa cuánto falta para llegar de ${c.b} a ${c.a}</div><div class="group-wrap"><div class="math-group">${c.b}</div><span class="symbol">➜</span><div class="math-group">?</div><span class="symbol">➜</span><div class="math-group">${c.a}</div></div></div>`;return}const groups=Array.from({length:c.b},()=>`<div class="math-group">${obj(c.a,c.o.e)}</div>`).join("");const repeated=Array.from({length:c.b},()=>c.a).join(" + ");box.innerHTML=`<div><div class="group-wrap">${groups}</div><div class="equation-strip">${repeated} = ?</div></div>`}
function optionRange(){if(player.mundo===1)return{min:0,max:10,delta:3};return{min:0,max:99,delta:10}}
function options(ans,n=3){const {min,max,delta}=optionRange(),s=new Set([ans]);let guard=0;while(s.size<n&&guard++<80){const v=Math.max(min,Math.min(max,ans+ri(-delta,delta)));if(v!==ans)s.add(v)}for(let i=min;s.size<n&&i<=max;i++)s.add(i);return shuffle([...s]).slice(0,n)}
function renderAnswers(values){const box=$("answers");box.innerHTML="";box.classList.toggle("two",values.length===2);values.forEach(v=>{const b=document.createElement("button");b.type="button";b.className="answer";b.textContent=v;b.setAttribute("aria-label",`Respuesta ${v}`);b.onclick=()=>choose(v,b);box.appendChild(b)})}
function update(){const total=totalRounds();$("roundText").textContent=`Reto ${Math.min(round+1,total)} de ${total}`;$("bar").style.width=`${round/total*100}%`;$("starCount").textContent=`⭐ ${stars}`}
function next(){if(round>=totalRounds())return finish();locked=false;misses=0;current=challenge();$("gameKicker").textContent=mundos[player.mundo].kicker;$("question").textContent=current.q;$("feedback").textContent="";$("hint").classList.remove("show");$("hint").innerHTML="";renderVisual(current);renderAnswers(options(current.answer));update();speak(current.speech)}
function choose(v,button){if(locked||!current)return;if(v===current.answer){locked=true;button.classList.add("good");stars++;const m=pick(good);$("feedback").textContent=m;$("starCount").textContent=`⭐ ${stars}`;speak(`${m} La respuesta es ${current.answer}.`);round++;$("bar").style.width=`${round/totalRounds()*100}%`;setTimeout(next,1050);return}misses++;const m=pick(gentle);$("feedback").textContent=m;speak(m);if(button.animate)button.animate([{transform:"translateX(0)"},{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],{duration:280});if(misses>=2)hint()}
function hintWorld1(){const a=current.answer,nums=Array.from({length:a},(_,i)=>`<span>${i+1}</span>`).join("");$("hint").innerHTML=`<div>💡 ${a===0?"No queda ningún objeto. Cuando no queda ninguno usamos el número cero.":"Vamos a contar juntos, despacito."}</div>${a>0?`<div class="hint-count">${nums}</div>`:""}`;return a>0?`Aquí tienes una pista. Contemos: ${Array.from({length:a},(_,i)=>i+1).join(", ")}. Ahora elige entre dos opciones.`:"Aquí tienes una pista. No queda ninguno. La respuesta puede ser cero."}
function hintWorld2(){if(current.type==="mult"){const repeated=Array.from({length:current.b},()=>current.a).join(" + ");$("hint").innerHTML=`<div>💡 Multiplicar también es sumar el mismo número varias veces.</div><div class="hint-count"><span>${repeated}</span><span>=</span><span>${current.answer}</span></div>`;return`Pista: suma ${current.a}, ${current.b} veces. ${repeated}. Ahora elige entre dos opciones.`}const tensA=Math.floor(current.a/10),onesA=current.a%10,tensB=Math.floor(current.b/10),onesB=current.b%10;if(current.type==="add2"){ $("hint").innerHTML=`<div>💡 Separa decenas y unidades.</div><div class="hint-count"><span>${tensA*10}</span><span>+</span><span>${onesA}</span><span>y</span><span>${tensB*10}</span><span>+</span><span>${onesB}</span></div>`;return`Pista: separa ${current.a} y ${current.b} en decenas y unidades. Luego suma las partes.`}const step=Math.ceil(current.b/10)*10;$("hint").innerHTML=`<div>💡 Busca el salto desde ${current.b} hasta ${current.a}.</div><div class="hint-count"><span>${current.b}</span><span>➜</span><span>${Math.min(step,current.a)}</span><span>➜</span><span>${current.a}</span></div>`;return`Pista: piensa cuánto debes avanzar desde ${current.b} para llegar a ${current.a}.`}
function hint(){if(!current||$("hint").classList.contains("show"))return;hints++;const text=player.mundo===2?hintWorld2():hintWorld1();$("hint").classList.add("show");let other=options(current.answer).find(v=>v!==current.answer);if(other===undefined)other=Math.max(0,current.answer-1);renderAnswers(shuffle([current.answer,other]));speak(`${text} Ahora tienes solo dos opciones.`)}
function startGame(){round=0;stars=0;hints=0;misses=0;locked=false;show("game");const w=mundos[player.mundo];speak(`¡Vamos, ${player.nombre}! Comienza tu misión en ${w.name}.`);setTimeout(next,650)}
function finish(){const key=`world${player.mundo}`;let p=load(PROGRESS_KEY,{});p[key]=p[key]||{missionsCompleted:0,bestStars:0,hintsUsed:0};p[key].missionsCompleted++;p[key].bestStars=Math.max(p[key].bestStars||0,stars);p[key].hintsUsed=(p[key].hintsUsed||0)+hints;p[key].lastPlayedAt=new Date().toISOString();save(PROGRESS_KEY,p);$("correctStat").textContent=stars;$("hintStat").textContent=hints;$("completeMascot").textContent=player.mundo===2?"🐒🏆":"🦊🏆";const place=player.mundo===2?"la Selva Matemática":"el Valle de los Números";$("completeMessage").textContent=`¡${player.nombre}, completaste tu recorrido por ${place}! Cada intento hizo crecer tu poder matemático.`;show("complete");speak(`¡Misión completada, ${player.nombre}! Lograste ${stars} retos. ¡Excelente aventura matemática!`)}
$("playerForm").onsubmit=e=>{e.preventDefault();const nombre=$("nombre").value.trim(),edad=Number($("edad").value);if(!nombre||!edad)return;player={nombre,edad,mundo:mundo(edad),creadoEn:new Date().toISOString()};save(PLAYER_KEY,player);configureWorld();show("world");const w=mundos[player.mundo];speak(`¡Excelente, ${nombre}! Tu aventura comienza en ${w.name}. ${w.desc}`)};
$("listenWelcome").onclick=welcome;
$("enterWorld").onclick=()=>{if(player&&player.mundo<=2)startGame()};
$("changePlayer").onclick=()=>{player=null;try{localStorage.removeItem(PLAYER_KEY)}catch{}$("nombre").value="";$("edad").value="";show("setup");setTimeout(welcome,200)};
$("home").onclick=()=>{if("speechSynthesis" in window)window.speechSynthesis.cancel();configureWorld();show("world")};

$("backWorld").onclick=()=>{configureWorld();show("world")};
if(player?.nombre&&player?.edad&&player?.mundo){$("nombre").value=player.nombre;$("edad").value=String(player.edad);configureWorld();show("world")}else show("setup");
})();
